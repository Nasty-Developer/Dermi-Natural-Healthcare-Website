kind = "web"
previewPath = "/"
title = "Dermi Natural Healthcare"
description = "The official Dermi Natural Healthcare website with company information, a searchable catalog for GLETSY, NEUTOGLOW and NEUTOZINC, and direct contact details."
version = "1.0.0"
id = "artifacts/dermi-natural-healthcare"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22639

[services.development]
run = "pnpm --filter @workspace/dermi-natural-healthcare run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dermi-natural-healthcare", "run", "build" ]
serve = "static"
publicDir = "artifacts/dermi-natural-healthcare/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22639"
BASE_PATH = "/"
